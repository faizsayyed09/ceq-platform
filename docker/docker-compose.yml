services:
  ceq-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      MAX_FILE_SIZE_MB: 500
      MAX_AUDIO_DURATION_SECONDS: 14400
      ALLOW_MANUAL_TOKEN_TESTING: "false"
      GENESYS_REGION: mypurecloud.com
    volumes:
      - ../generated_reports:/app/generated_reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
