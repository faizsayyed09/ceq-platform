services:
  ceq-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./.env.example
      - path: ./.env.local
        required: false
    environment:
      PYTHONPATH: /app/ceq-components:/app
      REPORT_DIR: /app/generated_reports
      HF_HOME: /app/cache/huggingface
      WHISPER_MODEL_CACHE: /app/models/whisper
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../api:/app/api:ro
      - ../modules:/app/modules:ro
      - ../services:/app/services:ro
      - ../components:/app/ceq-components:ro
      - ../generated_reports:/app/generated_reports
      - whisper_models:/app/models
      - hf_cache:/app/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  whisper_models:
  hf_cache:
