name: Build and Publish to ACR

on:
  push:
    branches:
      - transcriber-rewrite

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: acrceqdevfaiz01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            acrceqdevfaiz01.azurecr.io/ceq-platform:dev
            acrceqdevfaiz01.azurecr.io/ceq-platform:sha-${{ github.sha }}

      - name: Verify dev manifest exists
        run: docker buildx imagetools inspect acrceqdevfaiz01.azurecr.io/ceq-platform:dev

      - name: Verify SHA manifest exists
        run: docker buildx imagetools inspect acrceqdevfaiz01.azurecr.io/ceq-platform:sha-${{ github.sha }}
