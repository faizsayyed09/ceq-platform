name: CEQ CI

on:
  push:
    branches: [main, transcriber-rewrite]
  pull_request:
    branches: [main, transcriber-rewrite]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q api modules services components
      - run: pytest -q tests
      - run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config
